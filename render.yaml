services:
  - type: web
    name: sniffer
    runtime: static
    buildCommand: npm install && VITE_ETHERSCAN_API_KEY=$ETHERSCAN_API_KEY npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false
    envVars:
      - key: ETHERSCAN_API_KEY
        sync: false
      - key: VITE_API_BASE_URL
        value: https://sniffer-api-j1p4.onrender.com
  - type: web
    name: sniffer-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ETHERSCAN_API_KEY
        sync: false
      - key: TRONGRID_API_KEY
        sync: false
      - key: SOLANA_RPC_URL
        value: https://api.mainnet-beta.solana.com
      - key: DATABASE_URL
        fromDatabase:
          name: sniffer-db
          property: connectionString
      - key: ADMIN_SHARED_SECRET
        sync: false
      - key: WEBHOOK_SHARED_SECRET
        sync: false
      - key: SLACK_WEBHOOK_URL
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
databases:
  - name: sniffer-db
    databaseName: sniffer
    user: sniffer_user
    plan: free
